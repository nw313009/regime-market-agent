# Regime-Aware Market Intelligence Agent — configuration.
#
# Contains exactly the keys listed in docs/phase2_build_spec.md B0.
#
# No secrets here (spec rule 5). The Massive API key comes from the Databricks secret scope
# created in A-0 (scope "capstone", key "massive_api_key") and is injected into MassiveClient
# through its secret_getter argument.

catalog: market_intel

massive:
  # VERIFIED by the A-0 smoke test (two independent sessions): both routes return 200 here.
  #   aggregates  /v2/aggs/ticker/{ticker}/range/1/day/{from}/{to}
  #   news        /v2/reference/news
  base_url: https://api.massive.com
  # Configurable rather than hard-coded because the real ceiling depends on the active plan.
  # If backfill starts returning 429s, this value is wrong or the throttle is not sleeping.
  rate_limit_per_min: 5
  # Start of the backfill window used when a bronze table has no rows for a ticker yet.
  # A fixed ISO date, deliberately, not a rolling "N days back": a rolling window makes every
  # rebuild fetch a different dataset, which breaks the reproducibility story (setup/ scripts
  # plus this config should recreate the same Bronze) and shifts the backtest sample between
  # runs. Incremental runs advance from the per-ticker watermark regardless of this value.
  backfill_start_date: "2024-08-01"

tickers:
  # The 5 seed tickers. The ingestion universe is these plus every watchlist ticker.
  # AMD is deliberately absent: adding it live through the agent is the CDC demo moment.
  seed:
    - NVDA
    - MSFT
    - TSLA
    - AMZN
    - GOOGL

forecast:
  horizon_days: 5
  n_paths: 5000
  # One np.random.default_rng(seed) per forecast run; the seed is stored with the output.
  seed: 42

news:
  # Half-life in trading days of the news signal during simulation:
  #   news_h = current_news * exp(-ln(2) / half_life_days * h)
  # This is an assumption, not a measurement, and the UI discloses it.
  half_life_days: 2

backtest:
  # Refuse to fit with fewer observations than this.
  min_train_days: 252
  origin_freq: weekly
  n_weeks: 26

model:
  agent_endpoint: databricks-meta-llama-3-3-70b-instruct
  slm_endpoint: databricks-meta-llama-3-1-8b-instruct

search:
  # Added at C-1; the B0 key list names the index but not the knobs around it. Table names are
  # catalog-relative, like every other table reference in the code — `catalog` above supplies the
  # prefix, so pointing the whole project at a different catalog stays a one-line change.
  endpoint_name: market-intel-search
  index: silver.news_index
  # THE ROLLING WINDOW, NOT THE ARCHIVE. This was silver.news_articles until C-6 gave the window a
  # table of its own. Indexing the archive means embedding every article ever ingested and keeping
  # those vectors forever; indexing the window means the index tracks it — a row that ages out is
  # DELETED there and the next sync drops it from the index, so the corpus stays bounded without
  # anyone pruning it. It also makes the agent's search and the Market Research news list the same
  # set of articles, so the agent cannot cite a headline the page cannot show.
  # THE COST: no news older than news_recent.window_days is retrievable. Deliberate — the forecast
  # conditions on a 2-day half-life signal, and an article from last spring is not evidence about
  # today's regime. Widening it is news_recent.window_days plus a backfill, not a code change.
  source_table: silver.news_recent
  # The single unique key an AI Search index requires. news_recent is grained on
  # (article_id, ticker), so this is the derived doc_id column, not article_id (C-1).
  primary_key: doc_id
  # Managed embeddings: Databricks computes the vectors from embedding_text at sync time, so
  # nothing in this repo generates or stores an embedding.
  embedding_source_column: embedding_text
  # A Databricks-hosted pay-per-token embedding endpoint, present in the workspace by default.
  # TODO: if this endpoint is absent, `databricks-bge-large-en` is the other stock choice.
  embedding_model_endpoint: databricks-gte-large-en
  # Default k for search_market_news. Small on purpose: the agent has to name the titles it used,
  # and a long list invites hand-waving over specifics.
  top_k: 5

news_recent:
  # Added at C-5/C-6 for silver.news_recent, the rolling window the Market Research page reads.
  # The daily refresh MERGEs this many days of news_articles and deletes what falls out of the
  # window — the page's "recent news" list is exactly this long.
  window_days: 90
  # How much older history one optional backfill_news_recent run adds. The task is progressive so
  # a demo can deepen the window without a single run rewriting the whole archive.
  batch_days: 90
  # The oldest published_at news_recent will ever hold. Matches massive.backfill_start_date: there
  # is no news before it to find, so the backfill stops there rather than looping forever.
  backfill_floor: "2024-08-01"
  # ONE FLAG, TWO READERS, so they cannot disagree. setup/create_workflow.py adds the optional
  # backfill_news_recent task only when this is true, and refresh_news_recent stops deleting below
  # backfill_floor only when this is true. Split across two keys, one operator flipping one of them
  # would build a job whose refresh deletes exactly what its backfill just added.
  include_backfill: false

lakebase:
  # THESE ARE NOT SECRETS and none of them may become one. There is no password key here and there
  # must never be one.
  #
  # THE SYNC READS THROUGH LAKEHOUSE FEDERATION, not over the network directly. Added at C-6 as a
  # Spark JDBC connection and amended once it turned out that serverless compute cannot resolve the
  # Lakebase endpoint's hostname at all — a DNS wall, not a credential problem, so no amount of
  # correct connection facts below would ever have fixed it. Unity Catalog exposes Postgres as the
  # foreign catalog named here, and sync_lakebase_history is then an ordinary three-level-name
  # spark.sql read. The routing is the workspace's problem instead of ours.
  #
  # These two keys are the ones the job actually reads (src/pipelines/lakebase_history.py):
  federated_catalog: regime_lakebase
  schema: market_system
  # ^ the foreign catalog is backed by connection `regime_lakebase_conn`, which authenticates as
  #   the native Postgres role `federation_reader` (SELECT-only on market_system) with a static
  #   password held in the connection object. A native role rather than the app's service
  #   principal because a UC connection stores its credential once and OAuth tokens expire hourly.
  #
  # EVERYTHING BELOW DESCRIBES THE APP'S CONNECTION, and no code reads it. The app is the other
  # Lakebase client — psycopg from the app container, credentials from app.yaml's PG* env — and
  # this is kept as the record of what it connects to, in the one file that describes the project's
  # data plumbing. Deleting it would lose that; treating it as configuration would be a fiction.
  #
  # A kind note for whoever traces the history: the `capstone` secret scope still holds
  # lakebase_host and lakebase_user, wired in at f4a07f1 so a serverless task (which cannot be
  # given environment variables) could reach Postgres without committing workspace infrastructure
  # to a public repo. That wiring worked exactly as intended and is now unnecessary — the transport
  # it fed was the one that could not resolve the host. The reader was removed with the JDBC code;
  # the secrets are harmless and can stay.
  host: ""
  port: 5432
  database: databricks_postgres
  user: ""
  endpoint: projects/regime-market-database/branches/production/endpoints/primary

workflow:
  # Added at C-6. setup/create_workflow.py reads these; nothing else does.
  job_name: regime-market-daily
  # Quartz, not cron: Databricks schedules take a Quartz expression with a seconds field.
  # 22:30 UTC daily, after the US close (spec A1).
  schedule_quartz: "0 30 22 * * ?"
  timezone: UTC
  # Created PAUSED. A job that starts scheduling itself the moment it is defined will fire against
  # a half-configured workspace overnight; unpausing is a deliberate act.
  paused: true
  # Workspace path of the thin dispatcher notebook, WITHOUT the .py suffix — the Jobs API takes the
  # notebook's workspace path, and a trailing .py is a path that does not resolve.
  # This workspace puts Git folders under /Workspace/Users/<email>/, not /Workspace/Repos/.
  notebook_path: /Workspace/Users/nandawritam@gmail.com/regime-market-agent/notebooks/20_daily_run
  # Retries on the ingestion tasks only (spec C-6): those are the ones that fail for transient
  # network reasons, and a retried MLE fit fails the same way twice.
  ingestion_retries: 2
  # Whether the optional backfill_news_recent task is part of the job is news_recent.include_backfill
  # above, not a second key here — see the note there.

telemetry:
  # Added at C-3; the B0 key list predates the telemetry destination question. Where
  # src/llm/telemetry.py sends the one record it appends per model call:
  #   delta  MERGE the buffered records into gold.model_calls. Needs an injected SparkSession,
  #          so it is the value for notebooks and workflow tasks — and the spec's destination.
  #   log    keep the records in memory and log them on flush, writing nothing.
  #   off    record nothing at all.
  # The file default is the spec's destination. The Databricks App has NO SparkSession (C-5), so
  # app.yaml overrides this with TELEMETRY_MODE=log: one repository config is read by both the
  # app and the jobs, and the app is the exception rather than the rule.
  mode: delta
