# Databricks App manifest (spec C-5).
#
# Declares how the Streamlit app starts and what environment it gets: SQL warehouse id,
# catalog, and the Lakebase connection. The app's Python packages come from the repository
# requirements.txt automatically.
#
# No secrets in this file. Values are either workspace resource ids or references the
# workspace resolves at runtime.
#
# Workspace values filled in at deploy time. ONE IS STILL OPEN: LAKEBASE_USER, which cannot be
# known until the app exists, because it is the app's own service principal.
#
# TWO SETS OF GRANTS, and neither is optional. Both look like application bugs when missing:
#   Lakebase   the SP added as a Postgres role via the regime-market-database OAuth tab, then
#              USAGE on schema market_system plus table DML. Missing → "password authentication
#              failed for user '<uuid>'", which is not a password problem.
#   Unity Cat. the SP granted USE CATALOG + SELECT on market_intel, and CAN USE on the warehouse.
#              Missing → the app starts fine and every Delta query fails.
#
# EDIT THIS FILE IN GIT, NEVER IN THE WORKSPACE EDITOR. The app's source is a Git folder; editing
# it in place makes the workspace and the repository disagree about what is deployed, and the
# workspace copy is the one that gets overwritten by the next pull.

command: ["streamlit", "run", "app/app.py"]

env:
  # ---------------------------------------------------------------- Delta over SQL (C-5)
  # src/database/delta.py needs a hostname and an HTTP path. It accepts either half of each pair
  # and prefers the explicit one, so all four names are declared here rather than relying on what
  # the Apps runtime happens to inject:
  #
  #   hostname  DATABRICKS_SERVER_HOSTNAME, else DATABRICKS_HOST (scheme stripped either way)
  #   path      DATABRICKS_HTTP_PATH,       else built from DATABRICKS_WAREHOUSE_ID
  #
  # DATABRICKS_HOST is injected into an app automatically; DATABRICKS_SERVER_HOSTNAME is not, and
  # naming it here means the connection does not depend on that injection continuing to happen.
  # Host WITHOUT the https:// prefix — the connector wants a hostname, not a URL.
  - name: DATABRICKS_SERVER_HOSTNAME
    value: "dbc-47c4ef4d-9564.cloud.databricks.com"

  # Serverless SQL warehouse the app queries Delta through. The id is what an app resource
  # binding provides; the path is derived from it as /sql/1.0/warehouses/<id>.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "e92f4e2b2c11fc10"
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/e92f4e2b2c11fc10"

  # NO DATABRICKS_TOKEN. When it is absent the connector authenticates as the app's own service
  # principal through the SDK's credentials provider, which is the whole point of running as one.
  # A token here would be a secret in a config file (rule 5).

  # Unity Catalog catalog holding bronze / silver / gold.
  - name: CATALOG
    value: "market_intel"

  # ---------------------------------------------------------------- Lakebase (C-2)
  # Lakebase (Postgres) connection, read by src/database/lakebase.py through the pooled
  # psycopg v3 pattern in db.py. The LAKEBASE_* names below and the PG* names used locally in
  # .env are aliases of each other — settings_from_env accepts both, so one Lakebase project is
  # described identically in both places. There is NO password env var: each connection authenticates
  # with a short-lived credential from w.postgres.generate_database_credential, using the app's
  # own service principal identity.
  #
  # Instance: the capstone's own Lakebase project regime-market-database (Autoscaling, Postgres
  # branch production, endpoint primary).
  #
  # TODO before first deploy: create the Postgres role for this app's service principal via the
  # regime-market-database project's OAuth tab, then grant it USAGE on schema market_system plus
  # table privileges. Missing grants look like an application bug at deploy time; they are not.
  - name: LAKEBASE_HOST
    value: "ep-lingering-brook-d8izukis.database.us-east-2.cloud.databricks.com"
  - name: LAKEBASE_PORT
    value: "5432"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
  # The Postgres role the app connects as. NOT a human email: an app authenticates as its own
  # service principal, and that principal's Postgres role name is its CLIENT ID (a UUID). Read it
  # off the app's page from the field explicitly labelled service principal / client id — the
  # "App ID" on the overview is not necessarily the same thing. The same UUID is what gets added
  # as a Postgres role in the Lakebase OAuth tab, so one lookup serves both.
  # TODO: the last unfilled value in this file.
  - name: LAKEBASE_USER
    value: "REPLACE_ME_app_service_principal_client_id"
  # Endpoint resource name passed to w.postgres.generate_database_credential. Without it there is
  # no way to mint the per-connection credential, so the app cannot connect at all.
  - name: LAKEBASE_ENDPOINT
    value: "projects/regime-market-database/branches/production/endpoints/primary"
  # Informational only: src/database/lakebase.py fixes the schema as a constant, because a schema
  # name is an identifier and an environment-driven identifier would have to be spliced into SQL.
  - name: LAKEBASE_SCHEMA
    value: "market_system"

  # Model-call telemetry (C-3). "log" is mandatory here and is the one place the repository
  # config is overridden: config.yaml sets telemetry.mode=delta for notebooks and jobs, and a
  # Databricks App has NO SparkSession, so it cannot MERGE into gold.model_calls.
  - name: TELEMETRY_MODE
    value: "log"
