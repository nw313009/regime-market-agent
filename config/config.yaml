# Regime-Aware Market Intelligence Agent — configuration.
#
# Contains exactly the keys listed in docs/phase2_build_spec.md B0.
#
# No secrets here (spec rule 5). The Massive API key comes from the Databricks secret scope
# created in A-0 (scope "capstone", key "massive_api_key") and is injected into MassiveClient
# through its secret_getter argument.

catalog: market_intel

massive:
  # VERIFIED by the A-0 smoke test (two independent sessions): both routes return 200 here.
  #   aggregates  /v2/aggs/ticker/{ticker}/range/1/day/{from}/{to}
  #   news        /v2/reference/news
  base_url: https://api.massive.com
  # Configurable rather than hard-coded because the real ceiling depends on the active plan.
  # If backfill starts returning 429s, this value is wrong or the throttle is not sleeping.
  rate_limit_per_min: 5
  # Start of the backfill window used when a bronze table has no rows for a ticker yet.
  # A fixed ISO date, deliberately, not a rolling "N days back": a rolling window makes every
  # rebuild fetch a different dataset, which breaks the reproducibility story (setup/ scripts
  # plus this config should recreate the same Bronze) and shifts the backtest sample between
  # runs. Incremental runs advance from the per-ticker watermark regardless of this value.
  backfill_start_date: "2024-08-01"

tickers:
  # The 5 seed tickers. The ingestion universe is these plus every watchlist ticker.
  # AMD is deliberately absent: adding it live through the agent is the CDC demo moment.
  seed:
    - NVDA
    - MSFT
    - TSLA
    - AMZN
    - GOOGL

forecast:
  horizon_days: 5
  n_paths: 5000
  # One np.random.default_rng(seed) per forecast run; the seed is stored with the output.
  seed: 42

news:
  # Half-life in trading days of the news signal during simulation:
  #   news_h = current_news * exp(-ln(2) / half_life_days * h)
  # This is an assumption, not a measurement, and the UI discloses it.
  half_life_days: 2

backtest:
  # Refuse to fit with fewer observations than this.
  min_train_days: 252
  origin_freq: weekly
  n_weeks: 26

model:
  agent_endpoint: databricks-meta-llama-3-3-70b-instruct
  slm_endpoint: databricks-meta-llama-3-1-8b-instruct
